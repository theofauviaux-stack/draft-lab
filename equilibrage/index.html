<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draft Lab · Équilibrage</title>
<meta name="description" content="Équilibre deux équipes de League of Legends pour vos in house : elo Solo/Duo et rôles lus sur op.gg.">
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f1f3f6; --line: #dde1e7; --text: #1f2937; --muted: #6b7280;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #12151b; --panel: #1b1f27; --panel-2: #232833; --line: #333a47; --text: #e6e9ef; --muted: #9aa3b2; --gold: #c9a35c; --blue: #5b8cff; --red: #ee5d6a; --good: #3cc47e; --bad: #ee5d6a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #12151b; --panel: #1b1f27; --panel-2: #232833; --line: #333a47; --text: #e6e9ef; --muted: #9aa3b2; --gold: #c9a35c; --blue: #5b8cff; --red: #ee5d6a; --good: #3cc47e; --bad: #ee5d6a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-size: 13px; }
body { padding: 28px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--gold); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--gold); color: #fff; border-color: var(--gold); font-weight: 700; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.muted { color: var(--muted); font-size: 12px; }
.brand { max-width: 940px; margin: 0 auto 18px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.brand b i { color: var(--gold); font-style: normal; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.form-row label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
.st-form { text-align: left; background: var(--panel); padding: 22px; border-radius: 18px; border: 2px solid var(--gold); display: flex; flex-direction: column; gap: 10px; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(120px); background: var(--panel-2); border: 1px solid var(--gold); padding: 10px 16px; border-radius: 10px; transition: transform .3s; z-index: 50; max-width: calc(100vw - 32px); }
.toast.show { transform: translateX(-50%) translateY(0); }
.st-form.bal { width: min(940px, 92vw); margin: 0 auto; max-height: calc(100vh - 210px); overflow: auto; }
.bal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 18px; }
.bal-head .muted { font-size: 12px; }
.bal-in { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 12px; }
.bal-in textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); font: inherit; font-weight: 400; resize: vertical; }
.bal-list { display: flex; flex-direction: column; gap: 4px; }
.bal-empty { text-align: center; padding: 10px; }
.bal-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 70px 150px auto auto auto 26px; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); }
.bal-row.err { border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.bal-n { font-weight: 700; color: var(--muted); text-align: center; font-size: 12px; }
.bal-id { display: flex; flex-direction: column; min-width: 0; }
.bal-id b, .bal-id small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bal-id small { color: var(--muted); font-size: 11px; }
.bal-ch { display: flex; gap: 2px; } .bal-ch img { width: 22px; height: 22px; border-radius: 5px; }
.bal-rk { font-weight: 700; font-size: 12px; color: var(--c, var(--text)); white-space: nowrap; }
.bal-rk small { color: var(--muted); font-weight: 500; }
.bal-r { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.bal-row select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 5px; color: var(--text); font: inherit; font-size: 12px; }
.bal-man.need { border-color: var(--bad); }
.bal-x { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; } .bal-x:hover { color: var(--bad); }
.bal-help { font-size: 11.5px; margin: 0; }
.bal-top { display: grid; grid-template-columns: 1fr 1.3fr 1fr; align-items: center; gap: 12px; margin: 6px 0 10px; }
.bal-t { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 10px; }
.bal-t span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.bal-t b { font-size: 15px; }
.bal-t.blue { background: color-mix(in srgb, var(--blue) 10%, transparent); color: var(--blue); }
.bal-t.red { background: color-mix(in srgb, var(--red) 10%, transparent); color: var(--red); text-align: right; }
.bal-wr { text-align: center; display: flex; flex-direction: column; gap: 4px; }
.bal-wr b { font-size: 24px; color: var(--blue); }
.bal-bar { height: 8px; border-radius: 4px; background: var(--red); overflow: hidden; } .bal-bar i { display: block; height: 100%; background: var(--blue); }
.bal-wr small { color: var(--muted); font-size: 11px; }
.bal-lanes { display: flex; flex-direction: column; gap: 5px; }
.bal-lane { display: grid; grid-template-columns: 1fr 110px 1fr; align-items: center; gap: 8px; }
.bal-p { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); min-width: 0; }
.bal-p.blue { border-left: 3px solid var(--blue); } .bal-p.red { border-right: 3px solid var(--red); flex-direction: row-reverse; text-align: right; }
.bal-p b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.bal-fit { font-size: 14px; width: 16px; text-align: center; color: var(--gold); }
.bal-p.off .bal-fit { color: var(--bad); }
.bal-mid { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.bal-mid span { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.bal-mid i { font-style: normal; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.bal-mid i.b { color: var(--blue); } .bal-mid i.r { color: var(--red); }
.bal-sum { font-size: 11.5px; margin: 8px 0 0; }
.bal-actions { flex-wrap: wrap; }
.bal-rk.est small { font-style: italic; }
.bal-on { display: flex; justify-content: center; } .bal-on input { width: 15px; height: 15px; accent-color: var(--gold); cursor: pointer; }
.bal-row.off { opacity: .5; }
#balStep1 > .form-row:last-child { position: sticky; bottom: -22px; z-index: 2; background: var(--panel); padding: 10px 0 12px; margin-bottom: -12px; }
.st-form.bal { max-height: none; overflow: visible; }
#balStep1 > .form-row:last-child { position: static; margin: 0; padding: 4px 0 0; }
@media (max-width: 760px) {
  .bal-row { grid-template-columns: 22px minmax(0, 1fr) auto 26px; }
  .bal-row .bal-ch { display: none; }
  .bal-row .bal-r { grid-column: 2 / -1; }
  .bal-top { grid-template-columns: 1fr 1fr; } .bal-wr { grid-column: 1 / -1; order: -1; }
  .bal-lane { grid-template-columns: 1fr 64px 1fr; }
  .bal-p { padding: 6px; } .bal-p .bal-rk { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
